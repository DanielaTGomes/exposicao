<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais de Lisboa - Exposição</title>
    
    <!-- Ligação ao ficheiro CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. ECRÃ DO MENU INICIAL -->
    <div id="menu-screen">
        
        <!-- Imagem decorativa das pegadas -->
        <img src="animalx_patas.png" class="footprints-bg" alt="">

        <!-- CABEÇALHO -->
        <header class="header">
            <div class="titles">
                <h1>
                    <span class="title-bold">Animais de Lisboa.</span> 
                    <span class="title-light">Outra história da cidade</span>
                </h1>
                <p class="subtitle-desc">
                    Explora o Mapa Digital dos espaços e representações dos animais da cidade e põe à prova a tua visão de lince no jogo Tag ANIMALx, identificando os animais presentes no acervo do Museu de Lisboa.
                </p>
            </div>
            
            <!-- 2 Logótipos no Canto Superior Direito: Museu de Lisboa -> Animalx -->
            <div class="logos-container">
                <img src="logo_ml.png" alt="Museu de Lisboa" class="logo-museu">
                <img src="logo_completo_branco .png" alt="Animalx" class="logo-animalx">
            </div>
        </header>

        <!-- ÁREA CENTRAL: AS DUAS FERRAMENTAS -->
        <main class="choices-container">
            
            <!-- Opção 1: Mapa Digital -->
            <div class="choice-item" onclick="abrirAplicacao('mapa')">
                <div class="circle-frame">
                    <img src="mapa.png" alt="Mapa Digital">
                </div>
                <span class="choice-label">Mapa Digital</span>
            </div>

            <!-- Opção 2: Tag ANIMALx -->
            <div class="choice-item" onclick="abrirAplicacao('tag')">
                <div class="circle-frame">
                    <img src="tag.png" alt="Tag ANIMALx">
                </div>
                <span class="choice-label">Tag ANIMALx</span>
            </div>

        </main>
    </div>

    <!-- 2. ECRÃ DE EXIBIÇÃO (ONDE CARREGA O MAPA OU O TAG ANIMALX) -->
    <div id="app-container">
        <button id="back-btn" onclick="voltarAoMenu()">
            <span>⬅</span> Voltar ao Menu da Exposição
        </button>
        <iframe id="app-frame" src="" allow="fullscreen"></iframe>
    </div>

    <!-- Ligação ao ficheiro JavaScript externo -->
    <script src="script.js"></script>

    <!-- MOTOR DE ESCALA UNIVERSAL CALIBRADO PELA IMAGEM 2 (Base 1440x810 - Proporção 16:9) -->
    <script>
    function ajustarEscalaMenuExposicao() {
        const menu = document.getElementById('menu-screen');
        
        // Dimensões exatas onde o layout tem as proporções da tua Imagem 2
        const larguraBase = 1440;
        const alturaBase = 810;

        const escalaX = window.innerWidth / larguraBase;
        const escalaY = window.innerHeight / alturaBase;
        const escala = Math.min(escalaX, escalaY);

        if (menu) {
            menu.style.transform = `scale(${escala})`;
        }
    }

    window.addEventListener('DOMContentLoaded', ajustarEscalaMenuExposicao);
    window.addEventListener('resize', ajustarEscalaMenuExposicao);
    document.addEventListener('fullscreenchange', ajustarEscalaMenuExposicao);
    </script>
</body>
</html>
